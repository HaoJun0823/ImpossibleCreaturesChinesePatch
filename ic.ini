[global]
gameVersion = 1.1

; locale 汉化BY Randerion(HaoJun0823) 主页：https://www.haojun0823.xyz/ 仓库：https://github.com/HaoJun0823/ImpossibleCreaturesChinesePatch
; 这是简体中文的汉化配置文件。
lang = SimplifiedChinese
consoleKey = Grave
altConsoleKey = Backslash


; list of default room for MSN Gaming Zone that the game will try to join after logging-in
zonedefaultroom0 = Main Room
zonedefaultroom1 = Destroy Lab Room
zonedefaultroom2 = Destroy Base Room
zonedefaultroom3 = Hunt Rex Room
zonedefaultroom4 = Teamplay Room

; ic online play
refreshGames = 5
refreshRooms = 5

; ic online play
newsserver = ic.zone.msn.com
newsport = 80
newsfile = News/News.txt

zoneserver = ic.zone.msn.com
zoneport = 28810

authurl = http://ic.zone.msn.com/ZoneAccessService.asmx
authid = ImpCreat

patchurl = http://ic.zone.msn.com/patch

[network]

; time in seconds for timeout. default is 120
timeout = 30

